<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill 盘点 · 个人工作台</title>
<style>
:root{font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#25332e;background:#f4f5f1}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #8bb4a2;outline-offset:2px}.top{background:#fff;border-bottom:1px solid #dfe7df;padding:16px 28px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}.brand{font-weight:700;font-size:17px}.top a{color:#496d5b;text-decoration:none}.active{font-weight:700;border-bottom:2px solid #245c49}.wrap{max-width:1420px;margin:auto;padding:28px}.heading{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:25px;margin:0}.sub,.muted{color:#64746b}.sub{margin:5px 0 0}.button{border-radius:7px;padding:10px 14px;border:1px solid #d5e0d7;background:white;color:#2d4739;min-height:42px}.primary{background:#245c49;border-color:#245c49;color:#fff}.button:disabled{opacity:.5;cursor:not-allowed}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.stat{background:white;border:1px solid #e0e6df;border-radius:8px;padding:12px 16px;min-width:150px}.stat strong{font-size:22px;display:block}.stat span{font-size:12px;color:#63756a}.notice{padding:12px 15px;background:#f8f3e5;border:1px solid #eee3c3;border-radius:8px;line-height:1.6;color:#675829}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,390px);gap:16px;margin-top:18px;align-items:start}.panel{background:#fff;border:1px solid #e0e6df;border-radius:9px;min-width:0}.controls{padding:16px;border-bottom:1px solid #e9eee9;display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px}.controls input,.controls select{width:100%;border:1px solid #d6e0d8;border-radius:6px;padding:10px;min-height:42px;background:#fff}.listbar{padding:10px 16px;color:#65786d;font-size:12px;display:flex;justify-content:space-between}.list{max-height:66vh;overflow:auto}.item{border-top:1px solid #edf1ed;padding:15px 16px;display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px}.item input{width:17px;height:17px;margin:3px 0}.item h3{margin:0;font-size:15px;overflow-wrap:anywhere}.desc{color:#66776d;margin:4px 0;font-size:13px;line-height:1.55;overflow-wrap:anywhere}.meta{font-size:12px;color:#77877e;overflow-wrap:anywhere}.meta b{font-weight:500;color:#47735d}.side{position:sticky;top:16px;padding:20px}.side h2{font-size:17px;margin:0}.side p{font-size:13px;color:#68796e}.side button{width:100%;margin-top:8px}.selected{max-height:170px;overflow:auto;font-size:13px;padding-left:20px}.panel details{margin-top:18px;border-top:1px solid #edf0ed;padding-top:14px}.panel summary{cursor:pointer;color:#50685a}.roots{font-size:12px;color:#637168;overflow-wrap:anywhere}.output{width:100%;min-height:260px;border:1px solid #d6e0d8;border-radius:6px;padding:10px;resize:vertical;margin-top:12px}.empty{padding:28px;color:#718177}.toast{position:fixed;bottom:20px;right:20px;background:#244435;color:white;padding:10px 15px;border-radius:6px}.hidden{display:none}.compact{font-size:12px}.manual{white-space:pre-wrap;overflow-wrap:anywhere} @media(max-width:800px){.wrap{padding:16px}.layout{grid-template-columns:1fr}.side{position:static}.controls{grid-template-columns:1fr}.list{max-height:55vh}}
</style></head><body><header class="top"><span class="brand">个人工作台</span><a href="index.html">提示词</a><a href="skills.html" class="active" aria-current="page">Skill 盘点</a><span class="muted compact">只读扫描 · 页面不执行删除</span></header>
<main class="wrap"><div class="heading"><div><h1>Skill 盘点与清理清单</h1><p class="sub">按真实来源归并入口；勾选后交给 Agent 核对，不自动删除。</p></div><button class="button" id="refresh">如何重新扫描</button></div><div class="stats" id="stats"></div><div class="notice" id="notice"></div><div class="layout"><section class="panel" aria-label="Skill 列表"><div class="controls"><label><span class="compact muted">搜索名称、用途或路径</span><input id="search" type="search" placeholder="例如：代码审查、browser"></label><label><span class="compact muted">功能分类</span><select id="category"></select></label></div><div class="listbar"><span id="count"></span><button class="button" id="selectVisible">勾选当前结果</button></div><div class="list" id="list"></div></section><aside class="panel side"><h2>待处理清单</h2><p>勾选具体来源，不会自动合并同名 Skill；选项跨搜索和分类保留。</p><strong id="selectedCount">已选择 0 项</strong><ul id="selected" class="selected"></ul><button id="generate" class="button primary" disabled>生成 Agent 提示词</button><button id="clear" class="button">清空勾选</button><div id="result" hidden><label for="output" class="compact">生成的提示词（可手动复制）</label><textarea id="output" class="output" readonly></textarea><button id="copy" class="button">复制提示词</button></div><details><summary>扫描范围与限制</summary><div id="roots" class="roots"></div><p>未扫描其他项目、其他用户、未列出的自定义目录及 OpenViking 服务端 Skill；未分析完整引用和安装关系。分类仅按名称及说明做关键词推断。</p></details></aside></div></main><div id="toast" class="toast hidden" role="status"></div><script src="skills.generated.js"></script><script>
'use strict';
const data=window.SKILL_INVENTORY;const $=id=>document.getElementById(id);const selected=new Set();let renderedPrompt='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function refreshHelp(){alert('重新扫描：在终端运行以下命令，然后刷新此页面。\n\npython3 /Users/ziyun/workdir/self_project/AICodingBank/提示词库/prototype/skill_inventory.py\n\n扫描只读取固定范围的 Skill；不会删除任何内容。')}$('refresh').onclick=refreshHelp;
if(!data){$('notice').textContent='尚未生成本机扫描快照。请点击“如何重新扫描”，执行命令后刷新页面。';$('list').innerHTML='<div class="empty">暂无扫描数据。</div>';$('selectVisible').disabled=true}else{
const skills=data.skills;const entryCount=skills.reduce((n,x)=>n+x.entries.length,0);$('stats').innerHTML=`<div class="stat"><strong>${skills.length}</strong><span>不同真实来源（不按名称合并）</span></div><div class="stat"><strong>${entryCount}</strong><span>扫描范围内的入口</span></div><div class="stat"><strong>${data.roots.length}</strong><span>已读取的目录</span></div><div class="stat"><strong>${data.warnings.length}</strong><span>扫描提示</span></div>`;$('notice').textContent=`扫描快照：${new Date(data.generatedAt).toLocaleString()}。非全机扫描；不含 OpenViking 服务端 Skill。结果可能过期，执行前必须重新核实。`;$('roots').innerHTML='<ul>'+data.roots.map(r=>`<li>${esc(r.label)}：${esc(r.path)}</li>`).join('')+'</ul>'+(data.warnings.length?'<p>扫描提示：</p><ul>'+data.warnings.map(w=>`<li>${esc(w)}</li>`).join('')+'</ul>':'<p>扫描无异常提示。</p>');const cats=[...new Set(skills.map(s=>s.category))].sort();$('category').innerHTML='<option value="">全部分类</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');
function visible(){const terms=$('search').value.trim().toLowerCase().split(/\s+/).filter(Boolean),category=$('category').value;return skills.filter(s=>(!category||s.category===category)&&terms.every(t=>[s.name,s.description,s.source,s.category,...s.entries.map(e=>e.path)].join(' ').toLowerCase().includes(t)))}
function renderList(){const rows=visible();$('count').textContent=`显示 ${rows.length} / ${skills.length} 个来源`;$('list').innerHTML=rows.length?rows.map(s=>`<div class="item"><input type="checkbox" data-id="${esc(s.id)}" aria-label="选择 ${esc(s.name)} ${esc(s.source)}" ${selected.has(s.id)?'checked':''}><div><h3>${esc(s.name)}</h3><p class="desc">${esc(s.description)}</p><div class="meta"><b>${esc(s.category)}</b> · ${s.entries.length} 个入口 · ${s.entries.some(e=>e.symlink)?'含软链接':'真实目录'}<br>来源：${esc(s.source)}</div></div></div>`).join(''):'<div class="empty">没有匹配的 Skill，请换关键词或分类。</div>'}
function renderSelection(){let rows=skills.filter(s=>selected.has(s.id));$('selectedCount').textContent=`已选择 ${rows.length} 项`;$('selected').innerHTML=rows.map(s=>`<li>${esc(s.name)} <span class="muted">${esc(s.source)}</span></li>`).join('');$('generate').disabled=!rows.length;$('result').hidden=true;renderedPrompt=''}
$('search').oninput=renderList;$('category').onchange=renderList;$('list').onchange=e=>{if(e.target.matches('[data-id]')){e.target.checked?selected.add(e.target.dataset.id):selected.delete(e.target.dataset.id);renderSelection()}};$('selectVisible').onclick=()=>{visible().forEach(s=>selected.add(s.id));renderList();renderSelection()};$('clear').onclick=()=>{selected.clear();renderList();renderSelection()};
$('generate').onclick=()=>{const rows=skills.filter(s=>selected.has(s.id));renderedPrompt='请处理以下 Skill 清理候选。以下为只读扫描快照，不是删除授权，也不是完整依赖分析。\n扫描时间：'+data.generatedAt+'\n\n'+rows.map((s,i)=>`${i+1}. 名称：${s.name}\n   用途：${s.description}\n   分类：${s.category}（关键词推断，仅供参考）\n   实际来源：${s.source}\n   文件快照：${s.fingerprint}\n   发现的入口：\n${s.entries.map(e=>`   - ${e.path}（${e.root}；${e.symlink?'软链接':'目录'}）`).join('\n')}`).join('\n\n')+'\n\n执行要求：\n1. 重新核实当前路径、软链接目标、来源与安装管理方式，检查其他入口、引用及工作区状态；不要假设清单完整。\n2. 区分只移除入口、卸载包和删除源码；不跟随软链接删除目标，不批量删除共享仓库或其他 Skill。\n3. OpenViking 或包管理的 Skill 只能通过其正式管理方式处理；来源不明、影响不清、文件已变化或恢复方式不明时暂停该项并报告。\n4. 先将具体动作、影响、恢复方式合并成一份清单，等待我对本次删除明确批准；不得把本提示词或勾选视为删除授权。\n5. 批准后仅处理获准项目，逐项核对并报告成功、失败、跳过和遗留风险；不自动提交或推送。';$('output').value=renderedPrompt;$('result').hidden=false;$('output').focus()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(renderedPrompt);notify('已复制提示词')}catch{$('output').focus();$('output').select();notify('浏览器未允许复制，请手动复制选中文本')}};renderList();renderSelection()}
</script></body></html>
