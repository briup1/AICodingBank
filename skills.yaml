targets:
- ~/.agents/skills
- ~/.claude/skills
self:
- name: goal-coach
  path: skills/goal-coach
  capability: 判断任务是否适合 /goal，并生成完整中文 /goal prompt（完成标准/边界/停止规则）
  boundary: 只服务 Claude Code 的 /goal 命令场景
  tags:
  - 规划
  - 效率
  verified: '2026-08-23'
- name: agent-dag-reporting
  path: skills/agent-dag-reporting
  capability: 将多步骤任务的计划、状态、产物和检查点按 agent-dag/v1 上报到 Personal Workbench
  boundary: 仅负责可观测性上报，不改变任务执行方式；依赖宿主提供对应 MCP 上报工具
  tags:
  - 规划
  - 协作
  - 效率
  verified: '2026-08-24'
- name: framework-skill-author
  path: skills/framework-skill-author
  capability: 基于框架官方文档、API、版本记录和源码创建、刷新或审计可追溯的中文 Skill Pack
  boundary: 不用于普通文档摘要，也不接受非官方资料作为核心依据
  tags:
  - 编程
  - 架构
  - 研究
  verified: '2026-08-21'
- name: deepagents-getting-started
  path: skills/deepagents-pack/skills/deepagents-getting-started
  capability: 提供 DeepAgents 0.7.8 的最小闭环、总体架构和核心组件选型规则
  boundary: 不处理具体后端安全、子 Agent 拆分或版本敏感 API 查询
  tags:
  - 编程
  - 架构
  - 教学
  verified: '2026-08-21'
- name: deepagents-execution-environment
  path: skills/deepagents-pack/skills/deepagents-execution-environment
  capability: 设计 DeepAgents backend、虚拟文件系统、sandbox、shell 和权限边界
  boundary: 不负责总体入门、长期记忆建模或子 Agent 拆分
  tags:
  - 编程
  - 架构
  - 运维
  verified: '2026-08-21'
- name: deepagents-context-memory
  path: skills/deepagents-pack/skills/deepagents-context-memory
  capability: 设计 DeepAgents 上下文分层、文件化 offload、checkpoint 和跨线程长期记忆
  boundary: 不处理 sandbox 权限细节或子 Agent 拓扑
  tags:
  - 编程
  - 架构
  verified: '2026-08-21'
- name: deepagents-subagents
  path: skills/deepagents-pack/skills/deepagents-subagents
  capability: 设计 DeepAgents 同步、动态和异步子 Agent 委派及并发取消语义
  boundary: 不处理一般 backend 权限或单 Agent 入门
  tags:
  - 编程
  - 架构
  - 效率
  verified: '2026-08-21'
- name: deepagents-docs
  path: skills/deepagents-pack/skills/deepagents-docs
  capability: 查询并核验 DeepAgents 官方文档、API、版本差异和长尾问题
  boundary: 不替代入门、执行环境、上下文记忆或子 Agent 的稳定决策规则
  tags:
  - 编程
  - 研究
  verified: '2026-08-21'
- name: wl_req-confirm
  path: skills/wl_req-confirm
  capability: 需求确认——把模糊诉求变成人审批准的《需求确认文档》（重定义需求/用户故事/Out of Scope/验收）
  boundary: 只回答要什么/为什么/怎么算完成，不回答怎么做（方案设计归 wl_design-doc）
  tags:
  - 开发流程
  verified: '2026-08-31'
- name: wl_design-doc
  path: skills/wl_design-doc
  capability: 方案设计——需求批准后产出可批准的《方案设计文档》（映射/契约/复用分析/多方案/附证据审查/最小验证）
  boundary: 前置 wl_req-confirm 已批准；只出方案不写实现代码，不替用户拍板选方案
  tags:
  - 开发流程
  verified: '2026-08-31'
- name: wl_ticket-run
  path: skills/wl_ticket-run
  capability: 工单执行——方案批准后拆垂直切片工单（G/W/T 验收），/list 并行调度、/goal 审计执行到验收
  boundary: 前置 wl_design-doc 已批准；管执行纪律（台账/熔断/停机），不做需求与方案决策
  tags:
  - 开发流程
  verified: '2026-08-31'
- name: wl-brainstorming
  path: skills/wl-brainstorming
  capability: 将模糊的软件想法或行为变更澄清为经确认、可测试的设计
  boundary: 用于新功能或显著行为变更的需求与设计定稿，不执行已经批准的实现方案
  tags:
  - 开发流程
  - 需求分析
  - 设计
  verified: '2026-09-01'
- name: wl-browse
  path: skills/wl-browse
  capability: 通过真实浏览器完成页面导航、DOM 快照、表单交互、截图、响应式检查和端到端验证
  boundary: 仅负责浏览器自动化与视觉验证；使用自带 CLI，不依赖 gstack
  tags:
  - 浏览器
  - 测试
  - 自动化
  verified: '2026-09-01'
- name: wl-investigate
  path: skills/wl-investigate
  capability: 以证据优先和根因分析方式独立复现、定位并修复缺陷或回归
  boundary: 仅用于缺陷诊断与修复；修复前必须有失败复现，修复后必须验证
  tags:
  - 调试
  - 测试
  - 开发流程
  verified: '2026-09-01'
- name: wl-plan-design-review
  path: skills/wl-plan-design-review
  capability: 在编码前审查并完善 UI/UX 实施计划，使交互和视觉决策达到可实施状态
  boundary: 只审查前端体验与设计计划，不替代工程架构评审或代码实现
  tags:
  - 前端
  - 设计
  - 审查
  verified: '2026-09-01'
- name: wl-plan-eng-review
  path: skills/wl-plan-eng-review
  capability: 从架构、影响域、接口、数据、安全、性能、迁移、回滚和测试等维度审查实施计划
  boundary: 只做编码前的工程方案审查，不直接实施计划或替代代码审查
  tags:
  - 架构
  - 规划
  - 审查
  verified: '2026-09-01'
- name: wl-requesting-code-review
  path: skills/wl-requesting-code-review
  capability: 在交付前依据需求、架构、风险与测试证据审查已完成的代码
  boundary: 用于完整任务或重要功能实现后的代码审查，不用于需求澄清或方案设计
  tags:
  - 代码审查
  - 质量
  - 开发流程
  verified: '2026-09-01'
- name: wl-subagent-driven-development
  path: skills/wl-subagent-driven-development
  capability: 按已批准计划逐任务调度隔离 Worker，以测试优先、规格审查和质量审查完成开发
  boundary: 仅在方案已批准后使用；子 Agent 未获授权或不可用时必须在本地执行同等闸门
  tags:
  - 多智能体
  - 测试
  - 开发流程
  verified: '2026-09-01'
- name: wl-writing-plans
  path: skills/wl-writing-plans
  capability: 将已批准规格或稳定需求转换为详细、测试优先的实施计划
  boundary: 仅用于多步骤工程任务；需求或架构尚未确定时不得使用
  tags:
  - 规划
  - 测试
  - 开发流程
  verified: '2026-09-01'
third_party:
  lock: skills-lock.json
