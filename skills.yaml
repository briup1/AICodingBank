targets:
- ~/.agents/skills
- ~/.claude/skills
- ~/.hermes/skills
self:
- name: wl-external-enterprise-auth
  path: tools/skills/engineering/wl-external-enterprise-auth
  capability: 为独立项目接入外部企业账号体系，并把外部身份映射为本地会话、企业归属、执行主体和授权快照
  boundary: 提供通用接入流程、Provider 契约、安全检查和测试矩阵；不保存凭证，不替代目标项目授权模型，不直接操作外部公司系统
  tags:
  - 身份认证
  - 企业集成
  - 安全
  - 跨项目复用
  verified: '2026-10-17'
- name: wl-qa-test-planner
  path: tools/skills/engineering/wl-qa-test-planner
  capability: 根据需求生成带页面入口、场景、具体数据和编号树步骤的简洁手工用例，每步紧跟预期并保留需求追踪
  boundary: 仅生成用例、覆盖缺口及文档静态校验；不执行业务测试或写入，不猜页面地址，不做排期、Bug 报告或Figma校验；上游模板按需读取
  tags:
  - 测试
  verified: '2026-10-20'
- name: wl-web-auto
  path: tools/skills/shared/wl-web-auto
  capability: 使用 Ego TaskSpace 与页面脚本执行网页探索、查询、填表和核验，保留身份核对、测试记录、截图与人工交接；流程最多3任务并发
  boundary: 依赖本机 ego-browser Skill 与原生控制权规则；Ego 真实场景待验证，不静默回退其他驱动，不接管历史空间；业务写入需明确授权
  tags:
  - 浏览器
  - 自动化
  - 测试
  verified: ''
- name: hgj-git-connect
  path: tools/skills/engineering/hgj-git-connect
  capability: 诊断并切换公司 GitLab 的直连与 SSH 跳板路由，优先用只读检查确认当前可用链路
  boundary: 仅处理本机 GitLab SSH 连接与路由，不替代需求分支、合并、评审、发布或权限申请；不自动修改 known_hosts、不自动执行 pull/push
  tags:
  - Git
  - SSH
  - 本机工具
  verified: '2026-09-24'
- name: wl-git-flow
  path: tools/skills/engineering/wl-git-flow
  capability: 从最新 master 安全创建和单向集成需求分支，并以用户级静态/localhost 实时 HTML 看板聚合多项目 Worktree、Git 生命周期与异常
  boundary: 看板只监控和刷新，不启动 Agent 或执行 Git 写操作；测试和上线结果需真实确认；清理只删除 Worktree 目录，不删除本地或远端分支；Dev 和 Beta 只接收需求分支；上线走 release/yyyymmdd，发布成功后由 CI/CD 合进 master
  tags:
  - Git
  - 开发流程
  - 自动化
  verified: '2026-09-22'
- name: goal-coach
  path: tools/skills/workbench/goal-coach
  capability: 判断任务是否适合 /goal，并生成完整中文 /goal prompt（完成标准/边界/停止规则）
  boundary: 只服务 Claude Code 的 /goal 命令场景
  tags:
  - 规划
  - 效率
  verified: '2026-08-23'
- name: wl-herdrs
  path: tools/skills/workbench/wl-herdrs
  capability: 定义一层委派的个人策略，默认 Herdr 启动 Pi/high，不可用时允许当前宿主获准的原生 subagent
  boundary: 仅定义行为约定；Herdr 通道依赖 HERDR_ENV=1 与当前 CLI，备用通道须实际可用，不绕过用户禁令、审批拒绝或资源访问限制
  tags:
  - 协作
  - 效率
  - 开发流程
  verified: '2026-10-10'
- name: visual-artifact-workbench
  path: tools/skills/shared/visual-artifact-workbench
  capability: 统一跨项目可视文档的分类、原文证据、审核版本和本机分享处理方案
  boundary: 提供策略与白名单只读分享脚本，无通用发布CLI、认证或多人审核后台；不替代业务确认，不自动开放局域网
  tags:
  - 图表
  - 协作
  - 效率
  verified: ''
- name: framework-skill-author
  path: tools/skills/workbench/framework-skill-author
  capability: 基于框架官方文档、API、版本记录和源码创建、刷新或审计可追溯的中文 Skill Pack
  boundary: 不用于普通文档摘要，也不接受非官方资料作为核心依据
  tags:
  - 编程
  - 架构
  - 研究
  verified: '2026-08-21'
- name: deepagents-getting-started
  path: tools/skills/engineering/deepagents-pack/skills/deepagents-getting-started
  capability: 提供 DeepAgents 0.7.8 的最小闭环、总体架构和核心组件选型规则
  boundary: 不处理具体后端安全、子 Agent 拆分或版本敏感 API 查询
  tags:
  - 编程
  - 架构
  - 教学
  verified: '2026-08-21'
- name: deepagents-execution-environment
  path: tools/skills/engineering/deepagents-pack/skills/deepagents-execution-environment
  capability: 设计 DeepAgents backend、虚拟文件系统、sandbox、shell 和权限边界
  boundary: 不负责总体入门、长期记忆建模或子 Agent 拆分
  tags:
  - 编程
  - 架构
  - 运维
  verified: '2026-08-21'
- name: deepagents-context-memory
  path: tools/skills/engineering/deepagents-pack/skills/deepagents-context-memory
  capability: 设计 DeepAgents 上下文分层、文件化 offload、checkpoint 和跨线程长期记忆
  boundary: 不处理 sandbox 权限细节或子 Agent 拓扑
  tags:
  - 编程
  - 架构
  verified: '2026-08-21'
- name: deepagents-subagents
  path: tools/skills/engineering/deepagents-pack/skills/deepagents-subagents
  capability: 设计 DeepAgents 同步、动态和异步子 Agent 委派及并发取消语义
  boundary: 不处理一般 backend 权限或单 Agent 入门
  tags:
  - 编程
  - 架构
  - 效率
  verified: '2026-08-21'
- name: deepagents-docs
  path: tools/skills/engineering/deepagents-pack/skills/deepagents-docs
  capability: 查询并核验 DeepAgents 官方文档、API、版本差异和长尾问题
  boundary: 不替代入门、执行环境、上下文记忆或子 Agent 的稳定决策规则
  tags:
  - 编程
  - 研究
  verified: '2026-08-21'
- name: wl-req-change-tree
  path: tools/skills/engineering/wl-req-change-tree
  capability: 把原始需求整理成理解优先的业务变化树，展开交互、逻辑和数据语义并保留来源
  boundary: 只做文本结构化，不自动进入需求确认、技术设计、开发或测试流程；跨模型稳定性按实测范围判断
  tags:
  - 开发流程
  - 写作
  verified: '2026-10-19'
- name: wl-req-confirm
  path: tools/skills/engineering/wl-req-confirm
  capability: 需求确认——把模糊诉求变成人审批准的《需求确认文档》（重定义需求/用户故事/Out of Scope/验收）
  boundary: 只回答要什么/为什么/怎么算完成，不回答怎么做（方案设计归 wl-design-doc）
  tags:
  - 开发流程
  verified: '2026-08-31'
- name: wl-design-doc
  path: tools/skills/engineering/wl-design-doc
  capability: 方案设计——按业务场景组织目标、现状事实、最小例子、业务流程、技术承接、专项适用性与验收，生成可批准的单文件HTML
  boundary: 前置 wl-req-confirm 已批准；只出方案不写实现代码，不替用户拍板选方案
  tags:
  - 开发流程
  verified: '2026-08-31'
- name: wl-ticket-run
  path: tools/skills/engineering/wl-ticket-run
  capability: 工单执行——方案批准后拆垂直切片工单（G/W/T 验收），/list 并行调度、/goal 审计执行到验收
  boundary: 前置 wl-design-doc 已批准；管执行纪律（台账/熔断/停机），不做需求与方案决策
  tags:
  - 开发流程
  verified: '2026-08-31'
- name: wl-brainstorming
  path: tools/skills/engineering/wl-brainstorming
  capability: 将模糊的软件想法或行为变更澄清为经确认、可测试的设计
  boundary: 用于新功能或显著行为变更的需求与设计定稿，不执行已经批准的实现方案
  tags:
  - 开发流程
  - 需求分析
  - 设计
  verified: '2026-09-01'
- name: wl-compass-local-test
  path: tools/skills/engineering/wl-compass-local-test
  capability: compass-platform 本地自测环境一站式搭建与验证——本地 jar 起后端、vite 起前端、本地 RocketMQ 隔离 dev MQ，连 dev 库与外部依赖，含鉴权配方与全部已知坑解法
  boundary: 仅覆盖 compass-platform 后端/前端/Bot 的本地进程+dev 数据自测模式；不替代 dev 部署验收、小程序真机验证、SPOT 实时创建（IP 白名单受限）；dev 库写入只走业务 API
  tags:
  - compass-platform
  - 本地测试
  - 联调
  verified: '2026-10-09'
- name: wl-browse
  path: tools/skills/shared/wl-browse
  capability: 通过真实浏览器完成页面导航、DOM 快照、表单交互、截图、响应式检查和端到端验证
  boundary: 仅负责浏览器自动化与视觉验证；使用自带 CLI，不依赖 gstack
  tags:
  - 浏览器
  - 测试
  - 自动化
  verified: '2026-09-01'
- name: wl-investigate
  path: tools/skills/engineering/wl-investigate
  capability: 以证据优先和根因分析方式独立复现、定位并修复缺陷或回归
  boundary: 仅用于缺陷诊断与修复；修复前必须有失败复现，修复后必须验证
  tags:
  - 调试
  - 测试
  - 开发流程
  verified: '2026-09-01'
- name: wl-plan-design-review
  path: tools/skills/engineering/wl-plan-design-review
  capability: 在编码前审查并完善 UI/UX 实施计划，使交互和视觉决策达到可实施状态
  boundary: 只审查前端体验与设计计划，不替代工程架构评审或代码实现
  tags:
  - 前端
  - 设计
  - 审查
  verified: '2026-09-01'
- name: wl-plan-eng-review
  path: tools/skills/engineering/wl-plan-eng-review
  capability: 从架构、影响域、接口、数据、安全、性能、迁移、回滚和测试等维度审查实施计划
  boundary: 只做编码前的工程方案审查，不直接实施计划或替代代码审查
  tags:
  - 架构
  - 规划
  - 审查
  verified: '2026-09-01'
- name: wl-design-reachability-review
  path: tools/skills/engineering/wl-design-reachability-review
  capability: 从已实现的真实原点沿方案流程、状态和契约逐跳思维实验，证明需求终点是否可达
  boundary: 只发现设计 Gap、对接断点及不成立假设，不做泛化工程评审、不实现代码或扩大需求
  tags:
  - 架构
  - 规划
  - 审查
  verified: ''
- name: wl-requesting-code-review
  path: tools/skills/engineering/wl-requesting-code-review
  capability: 在交付前依据需求、架构、风险与测试证据审查已完成的代码
  boundary: 用于完整任务或重要功能实现后的代码审查，不用于需求澄清或方案设计
  tags:
  - 代码审查
  - 质量
  - 开发流程
  verified: '2026-09-01'
- name: wl-subagent-driven-development
  path: tools/skills/engineering/wl-subagent-driven-development
  capability: 按已批准计划逐任务调度隔离 Worker，以测试优先、规格审查和质量审查完成开发
  boundary: 仅在方案已批准后使用；子 Agent 未获授权或不可用时必须在本地执行同等闸门
  tags:
  - 多智能体
  - 测试
  - 开发流程
  verified: '2026-09-01'
- name: wl-writing-plans
  path: tools/skills/engineering/wl-writing-plans
  capability: 将已批准规格或稳定需求转换为详细、测试优先的实施计划
  boundary: 仅用于多步骤工程任务；需求或架构尚未确定时不得使用
  tags:
  - 规划
  - 测试
  - 开发流程
  verified: '2026-09-01'
- name: wl-auto-delivery
  path: tools/skills/workbench/wl-auto-delivery
  capability: 按需选择当前阶段，串起需求、业务分组用例、独立审查、方案决策、开发、聚焦Review与目标环境验收
  boundary: 不强制只读或简单任务走完整流水线；各环节可独立使用，委托不替代高风险授权，静态检查不等于真实交付验证
  tags:
  - 规划
  - 开发流程
  verified: '2026-10-19'
- name: wl-harness-setup
  path: tools/skills/engineering/wl-harness-setup
  capability: 为新项目、自主项目和团队个人接入建立或补齐开发底座，统一规则与Wiki正文结构及docs/changes需求归宿
  boundary: 复用已有Owner、按需生成；共用模板与只读结构检查；不改业务代码、不建账号数据库、不自动提交或安装；个人测试密码只进获准忽略文件
  tags:
  - 规划
  - 架构
  - 开发流程
  verified: ''
- name: wl-harness-sync
  path: tools/skills/engineering/wl-harness-sync
  capability: 按本次需求或明确变更增量维护原有规则与Wiki，与setup共用结构，规范变化记录回同一需求目录
  boundary: 不要求先运行setup、不全库审计或重建；历史异构资料先报差异，迁移另确认；不改业务代码、不读取真实密码、不自动提交或安装
  tags:
  - 开发流程
  - 效率
  verified: ''
- name: wl-prod-db
  path: tools/skills/engineering/wl-prod-db
  capability: 查询海管家生产 MySQL 和生产 Mongo。MySQL 走 opencli yearning，Mongo 走 opencli archery
  boundary: 不查 dev/beta 日志，不替代 agent-tools fuxi；MySQL 只收带 LIMIT 的 SELECT，Mongo 只收 prd-mongo 上的 find 一类只读语句，返回行数 1 到 1000
  tags:
  - 数据库
  - 开发流程
  verified: '2026-09-23'
- name: wl-docker-port-registry
  path: tools/skills/shared/wl-docker-port-registry
  capability: 用 lsof/docker ps/curl 三板斧查明本机端口占用真身，并按 3000-3099 段 10 位槽位规则为新服务分配宿主端口、登记本机台账并显式写入项目 .env
  boundary: 只管宿主端口查询、分配与登记；不管理容器生命周期、不改在跑服务端口、不执行清理操作；台账只记分配决策，实时占用以查询为准
  tags:
  - Docker
  - 本机工具
  - 端口管理
  verified: '2026-10-03'
