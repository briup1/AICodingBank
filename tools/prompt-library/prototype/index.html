<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#25332e;background:#f4f5f1;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8bb4a2;outline-offset:2px}.top{height:68px;background:#fff;border-bottom:1px solid #e2e7e1;display:flex;align-items:center;padding:0 32px;gap:12px}.mark{background:#245c49;color:white;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-weight:700}.brand{font-weight:700;font-size:17px}.subbrand{color:#88938c;margin-left:8px;font-size:13px}.demo{margin-left:auto;background:#f8f1dc;color:#765d26;padding:6px 10px;border-radius:5px;font-size:12px}.shell{max-width:1500px;margin:auto;padding:32px}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.14em;color:#638577;font-weight:700}.heading h1{font-size:28px;letter-spacing:-.03em;margin:8px 0}.heading p{color:#75827a;margin:0}.primary,.secondary,.danger{border-radius:7px;padding:10px 16px;min-height:42px}.primary{background:#245c49;border:1px solid #245c49;color:#fff}.primary:hover{background:#174835}.secondary{background:#fff;border:1px solid #dce3dc;color:#33463b}.secondary:hover{background:#f2f6f2}.danger{background:#fff;border:1px solid #ead6d2;color:#a04034}.layout{display:grid;grid-template-columns:260px minmax(280px,360px) minmax(350px,1fr);gap:16px;align-items:start}.panel{background:white;border:1px solid #e1e6e0;border-radius:10px;min-width:0}.sidebar{padding:20px}.side-label{font-size:12px;font-weight:700;color:#87938b;letter-spacing:.08em;margin:4px 0 12px}.filter{display:flex;width:100%;border:0;background:transparent;text-align:left;justify-content:space-between;padding:10px 12px;border-radius:6px;color:#56665c;margin-bottom:3px}.filter.active{background:#e9f1eb;color:#205b43;font-weight:700}.side-note{margin-top:28px;padding:16px 0 0;border-top:1px solid #edf0eb;color:#829087;font-size:12px;line-height:1.7}.side-note strong{color:#55665a}.list-head{padding:20px;border-bottom:1px solid #edf0eb}.search{width:100%;border:1px solid #dce4dd;border-radius:7px;padding:11px 12px;background:#fbfcfa}.list-meta{display:flex;justify-content:space-between;color:#89958c;font-size:12px;margin-top:16px}.results{padding:8px;max-height:68vh;overflow:auto}.item{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:7px;padding:14px 12px;color:inherit}.item:hover{background:#f8faf7}.item.active{background:#f0f6f1;border-color:#dceadf}.item-title{font-weight:700;font-size:15px}.item-desc{font-size:13px;color:#78877d;margin:8px 0;line-height:1.5}.item-foot{color:#7e8c82;font-size:12px;display:flex;gap:8px;flex-wrap:wrap}.tag{color:#4b7860}.empty{padding:25px 14px;color:#839087;line-height:1.7;font-size:13px}.detail{padding:28px;min-height:580px}.detail-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.badge{color:#4d735f;background:#eef5ef;border-radius:4px;padding:5px 8px;font-size:12px}.detail h2{font-size:24px;letter-spacing:-.03em;margin:16px 0 8px}.description{color:#78867d;line-height:1.6;margin:0}.detail-actions{display:flex;gap:8px;flex-wrap:wrap}.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}.section-head h3{font-size:13px;margin:0;color:#506159}.helper{font-size:12px;color:#89958c;line-height:1.5}.variables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;color:#62746a;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #dce4dd;border-radius:6px;padding:10px;background:#fff;color:#25332e}.field textarea{resize:vertical;line-height:1.6}.preview{background:#f7f9f6;border:1px solid #e9eee7;border-radius:8px;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;color:#405148;min-height:140px}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}.notice{font-size:12px;color:#8b968e;line-height:1.5}.toast{position:fixed;bottom:24px;right:24px;background:#253d32;color:#fff;border-radius:7px;padding:12px 16px;box-shadow:0 5px 18px #0002;max-width:90vw;z-index:3}.hidden{display:none!important}dialog{border:0;border-radius:12px;padding:0;width:min(660px,calc(100vw - 32px));box-shadow:0 24px 70px #17261b33}dialog::backdrop{background:#19271fb0}.modal-head{padding:22px 24px;border-bottom:1px solid #e9eee9;display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:19px;margin:0}.form-body{padding:22px 24px;display:grid;gap:15px;max-height:68vh;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-actions{padding:16px 24px;border-top:1px solid #e9eee9;display:flex;align-items:center;gap:8px;justify-content:flex-end}.error{color:#a53f32;font-size:13px;margin-right:auto}.link{background:none;border:0;color:#8b554b;text-decoration:underline;padding:4px}.copy-fallback{width:100%;min-height:120px;margin-top:10px}.delete-copy{padding:24px;line-height:1.7;color:#56665c}.small{font-size:12px}.muted{color:#819087}@media(max-width:1100px){.layout{grid-template-columns:220px minmax(260px,1fr)}.detail{grid-column:1/-1;min-height:0}}@media(max-width:700px){.top{padding:0 16px}.subbrand{display:none}.shell{padding:20px 14px}.heading{align-items:start}.heading h1{font-size:24px}.layout{grid-template-columns:1fr}.sidebar{padding:12px}.filters{display:flex;gap:4px;overflow:auto}.filter{white-space:nowrap;width:auto;gap:12px}.side-note{display:none}.results{max-height:300px}.detail{grid-column:auto;padding:20px}.variables,.row{grid-template-columns:1fr}.detail-top{flex-direction:column}.demo{font-size:11px}}

/* 编辑器式布局：列表负责定位，正文优先于变量操作。 */
.shell{max-width:1440px;padding:24px 32px}.heading{align-items:center;margin-bottom:18px}.heading h1{font-size:22px;margin:0}.heading p,.heading .eyebrow{display:none}.layout{grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:16px;align-items:stretch}.sidebar{grid-column:1;grid-row:1;padding:14px 16px;border-bottom:0;border-radius:10px 10px 0 0}.side-label,.side-note{display:none}.filters{display:flex;gap:4px;overflow:auto}.filter{white-space:nowrap;width:auto;gap:8px;padding:9px}.layout>section[aria-label="提示词列表"]{grid-column:1;grid-row:1;margin-top:60px;border-radius:0 0 10px 10px;border-top:0}.detail{grid-column:2;grid-row:1;min-height:620px}.detail .preview{background:#fff;border:0;border-top:1px solid #e9eee7;border-bottom:1px solid #e9eee7;border-radius:0;padding:22px 0;min-height:220px;font-size:15px}.detail .section{margin-top:22px}.detail .form-body{padding:12px 0;max-height:none}.detail .form-actions{padding:16px 0}.detail .modal-head{padding:0 0 16px}.detail .modal-head h2{margin:0;font-size:20px}.use-box{margin-top:20px;padding:18px;background:#f7f9f6;border:1px solid #e9eee7;border-radius:8px}.use-box .preview{min-height:100px;background:transparent}.use-box[hidden]{display:none}.use-box .section{margin-top:0}.use-box .section+.section{margin-top:20px}
@media(max-width:700px){.shell{padding:16px}.layout{display:flex;flex-direction:column;gap:0}.sidebar,.layout>section[aria-label="提示词列表"],.detail{width:100%;margin:0}.layout>section[aria-label="提示词列表"]{border-radius:0 0 10px 10px}.detail{margin-top:16px;min-height:0}.heading{gap:10px}.heading h1{font-size:20px}.detail .preview{min-height:140px}}

/* 桌面端左栏独立吸顶；只有列表内部滚动。 */
.left-column{grid-column:1;grid-row:1;align-self:start;position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}
.left-column .sidebar{flex:none}
.left-column section[aria-label="提示词列表"]{display:flex;flex-direction:column;min-height:0;border-radius:0 0 10px 10px;border-top:0}
.left-column .list-head{flex:none}
.left-column .results{min-height:0;max-height:none;overflow-y:auto;overscroll-behavior:contain}
.left-column .sidebar{padding:16px 20px 12px}.filters{display:block;overflow:visible}.filters label{display:block;color:#62746a;font-size:12px;margin:14px 0 6px}.filters select{width:100%;min-height:42px;padding:8px 10px;background:#fff;border:1px solid #dce4dd;border-radius:6px;color:#25332e}.left-column .list-head{padding:16px 20px}.search-hint{color:#75857b;font-size:12px;line-height:1.5;margin:6px 0 0}
@media(max-width:700px){.left-column{position:static;max-height:none;width:100%}.left-column .results{max-height:300px}}
/* 与 Skill 盘点页保持一致的顶部导航。 */
.top{height:auto;min-height:57px;padding:16px 28px;gap:20px;flex-wrap:wrap;border-color:#dfe7df}.top a{color:#496d5b;text-decoration:none}.top a:focus-visible{outline:3px solid #8bb4a2;outline-offset:2px}.top .nav-active{font-weight:700;border-bottom:2px solid #245c49}.top .nav-note{color:#64746b;font-size:12px}
</style>
</head>
<body>
<header class="top"><span class="brand">个人工作台</span><a href="index.html" class="nav-active" aria-current="page">提示词</a><a href="skills.html">Skill 盘点</a><span class="nav-note">交互原型 · 仅本次页面会话</span></header>
<main class="shell"><div class="heading"><div><h1>我的提示词</h1></div><button class="primary" id="new">＋ 新建提示词</button></div>
<div class="layout"><div class="left-column"><aside class="panel sidebar"><div class="side-label">浏览提示词</div><label class="small muted" for="search">全局搜索</label><input id="search" class="search" type="search" placeholder="搜索全部提示词"><p class="search-hint">输入关键词时搜索全部分类</p><div class="filters"><label for="filters">分类筛选</label><select id="filters" aria-label="分类筛选"></select></div><div class="side-note"><strong>关于这个原型</strong><br>正文来自工作台提示词库的生成快照。编辑仅保存在当前页面，刷新后重置，不写入源文件。</div></aside><section class="panel" aria-label="提示词列表"><div class="list-head"><div class="list-meta"><span id="count"></span><span>标题 · 用途 · 标签 · 正文</span></div></div><div id="results" class="results"></div></section></div><section class="panel detail" id="detail" aria-label="提示词详情"></section></div></main>
<div id="editor" hidden><form id="form"><div class="modal-head"><h2 id="formTitle">新建提示词</h2><button type="button" class="secondary" id="closeEditor">关闭</button></div><div class="form-body"><div class="field"><label for="title">标题 *</label><input id="title" required maxlength="100" placeholder="例如：根因排查"></div><div class="field"><label for="description">用途说明</label><input id="description" placeholder="什么时候适合使用？"></div><div class="row"><div class="field"><label for="category">分类</label><select id="category"><option>Spec 驱动开发</option><option>更深入而不是更大</option><option>项目经理交付</option><option>Codex 交接与审计</option><option>其他</option></select></div><div class="field"><label for="status">验证状态</label><select id="status"><option>未实测（2026-11-09 入库）</option><option>格式参照，未在本工作台实测</option><option>未实测（2026-11-09 入库）· 本套里唯一确认的差量</option><option>未实测（2026-11-15 入库）</option><option>未实测</option><option>已验证</option><option>未标注</option></select></div></div><div class="field"><label for="tags">标签 <span class="muted">（用逗号分隔）</span></label><input id="tags" placeholder="排查, 根因, 调试"></div><div class="field"><label for="content">提示词正文 *</label><textarea id="content" rows="9" required placeholder="用 {{变量名}} 表示需要使用时填写的内容"></textarea><div class="helper">用双大括号声明变量，例如 {{项目}}。本原型只保存到当前页面会话。</div></div></div><div class="form-actions"><span class="error" id="formError" role="alert"></span><button class="secondary" type="button" id="cancel">取消</button><button class="primary" type="submit">保存到原型</button></div></form></div>
<dialog id="confirmDelete"><div class="modal-head"><h2>删除这条演示提示词？</h2></div><div class="delete-copy">这只会删除当前页面中的演示数据，不会修改仓库文件。刷新页面后演示数据会恢复。</div><div class="form-actions"><button class="secondary" id="deleteCancel">取消</button><button class="danger" id="deleteConfirm">确认删除</button></div></dialog>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="prompts.generated.js"></script>
<script>
'use strict';
// 数据为生成时的原文快照；编辑不会写回源文件。
let prompts = window.WORKBENCH_PROMPTS || [];
let selected=prompts[0]?.id || null, filter='全部', values={}, editing=null, dirty=false, timer, editingOpen=false;
const valueCache={};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function vars(p){return [...new Set([...p.content.matchAll(/\{\{\s*([^{}]+?)\s*\}\}/g)].map(m=>m[1]))]}
function renderFilters(){const cats=['全部', ...new Set(prompts.map(p=>p.category))];$('filters').innerHTML=cats.map(c=>`<option value="${esc(c)}">${esc(c==='全部'?'全部分类':c)}（${c==='全部'?prompts.length:prompts.filter(p=>p.category===c).length}）</option>`).join('');$('filters').value=filter}
function renderList(){let q=$('search').value.trim().toLowerCase(),terms=q?q.split(/\s+/):[];let fields=p=>[['标题',p.title],['用途',p.description],['标签',p.tags.join(' ')],['正文',p.content]];let rows=prompts.filter(p=>(filter==='全部'||p.category===filter)&&terms.every(t=>fields(p).some(([,v])=>v.toLowerCase().includes(t))));$('count').textContent=`${rows.length} 条提示词`;$('results').innerHTML=rows.length?rows.map(p=>{let matched=terms.length?fields(p).filter(([,v])=>terms.some(t=>v.toLowerCase().includes(t))).map(([name])=>name).join('、'):'';return `<button class="item ${p.id===selected?'active':''}" data-id="${esc(p.id)}" aria-pressed="${p.id===selected}"><div class="item-title">${esc(p.title)}</div><div class="item-desc">${esc(p.description||'暂无用途说明')}</div><div class="item-foot"><span>${esc(p.category)}</span><span>· ${esc(p.status)}</span>${matched?`<span class="tag">· 命中${esc(matched)}</span>`:''}</div></button>`}).join(''):'<div class="empty">没有找到匹配的提示词。<br>试试更短的关键词，或切换分类。</div>';if(!rows.some(p=>p.id===selected))$('detail').innerHTML='<div class="empty">当前选中的提示词不在搜索结果中。<br>请选择结果，或调整搜索条件。</div>';else renderDetail()}
function output(p){return p.content.replace(/\{\{\s*([^{}]+?)\s*\}\}/g,(all,k)=>values[k]?.trim()?values[k]:all)}
function renderDetail(){let p=prompts.find(x=>x.id===selected);if(!p){$('detail').innerHTML='<div class="empty">选择一条提示词，查看内容并使用。</div>';return}let v=vars(p);$('detail').innerHTML=`<div class="detail-top"><div><span class="badge">${esc(p.category)} · ${esc(p.kind||'提示词')} · ${esc(p.status)}</span><h2>${esc(p.title)}</h2><p class="description">${esc(p.description||'暂无用途说明')}</p></div><div class="detail-actions"><button class="secondary" id="edit">编辑</button><button class="link" id="delete">删除</button></div></div><div class="section"><div class="item-foot">${p.tags.length?p.tags.map(t=>`<span class="tag"># ${esc(t)}</span>`).join(''):'<span>未添加标签</span>'}</div></div><div class="section"><div class="section-head"><h3>提示词正文</h3><span class="helper">${esc(p.source||'本次会话新建')}</span></div><div class="preview">${esc(p.content)}</div></div><div class="footer"><span class="notice">实际资料快照 · 编辑仅当前页面会话有效</span><div class="detail-actions"><button class="secondary" id="copyRaw">复制原文</button><button class="primary" id="use">填写变量并使用</button></div></div><div id="copyHelp"></div><div class="use-box" id="useBox" hidden><div class="section"><div class="section-head"><h3>填写变量</h3><span class="helper">${v.length?'仅影响本次复制':'这条提示词没有变量'}</span></div><div class="variables">${v.map(k=>`<div class="field"><label for="v-${esc(k)}">${esc(k)}</label><textarea id="v-${esc(k)}" data-var="${esc(k)}" rows="2" placeholder="填写${esc(k)}">${esc(values[k]||'')}</textarea></div>`).join('')}</div></div><div class="section"><div class="section-head"><h3>最终内容预览</h3><span class="helper">随填写内容实时更新</span></div><div class="preview" id="preview"></div></div><div class="footer"><span class="helper">变量未填时会提示</span><button class="primary" id="copy">复制填写后的内容</button></div></div>`;updatePreview();$('edit').onclick=()=>openEditor(p);$('delete').onclick=()=>$('confirmDelete').showModal();$('use').onclick=()=>{let box=$('useBox');box.hidden=!box.hidden;$('use').textContent=box.hidden?'填写变量并使用':'收起变量填写';if(!box.hidden)box.scrollIntoView({block:'nearest'})};$('copyRaw').onclick=()=>copy(true);$('copy').onclick=()=>copy(false);document.querySelectorAll('[data-var]').forEach(el=>el.addEventListener('input',()=>{values[el.dataset.var]=el.value;updatePreview()}))}
function updatePreview(){let p=prompts.find(x=>x.id===selected);if(p&&$('preview'))$('preview').textContent=output(p)}
function render(){renderFilters();renderList()}
$('filters').onchange=e=>{filter=e.target.value;if(filter!=='全部')$('search').value='';renderList()};$('search').oninput=()=>{filter='全部';renderFilters();renderList()};$('results').onclick=e=>{let b=e.target.closest('[data-id]');if(b){valueCache[selected]=values;selected=b.dataset.id;values=valueCache[selected]||{};renderList()}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
async function copy(raw=false){let p=prompts.find(x=>x.id===selected);if(!p)return;let missing=vars(p).filter(k=>!values[k]?.trim());if(!raw&&missing.length&&!confirm(`尚未填写：${missing.join('、')}。仍然复制含占位符的内容吗？`))return;let text=raw?p.content:output(p);try{if(!navigator.clipboard)throw Error('unavailable');await navigator.clipboard.writeText(text);toast('已复制到剪贴板')}catch{$('copyHelp').innerHTML='<label for="fallback" class="helper">浏览器未允许自动复制，请手动选中并复制：</label><textarea id="fallback" class="copy-fallback" readonly></textarea>';$('fallback').value=text;$('fallback').focus();$('fallback').select();toast('请手动复制选中的内容')}}
function openEditor(p){if(editingOpen&&!closeEditor())return;editing=p?.id||null;dirty=false;editingOpen=true;$('formTitle').textContent=p?'编辑提示词':'新建提示词';$('title').value=p?.title||'';$('description').value=p?.description||'';$('category').value=p?.category||'其他';$('status').value=p?.status||'未验证';$('tags').value=p?.tags.join(', ')||'';$('content').value=p?.content||'';$('formError').textContent='';$('detail').replaceChildren($('form'));$('search').disabled=true;$('filters').inert=true;$('results').inert=true;$('title').focus()}
$('new').onclick=()=>openEditor(null);$('form').addEventListener('input',()=>dirty=true);function closeEditor(){if(dirty&&!confirm('内容尚未保存，确定放弃本次修改吗？'))return false;$('editor').appendChild($('form'));editingOpen=false;dirty=false;$('search').disabled=false;$('filters').inert=false;$('results').inert=false;render();return true}$('closeEditor').onclick=closeEditor;$('cancel').onclick=closeEditor;
$('form').onsubmit=e=>{e.preventDefault();let title=$('title').value.trim(),content=$('content').value.trim();if(!title||!content){$('formError').textContent='标题和正文不能为空。';return}let original=prompts.find(x=>x.id===editing);let p={id:editing||('demo-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)),source:original?.source||'',kind:original?.kind||'提示词',title,description:$('description').value.trim(),category:$('category').value,status:$('status').value,tags:$('tags').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),content};if(editing){let i=prompts.findIndex(x=>x.id===editing);if(i<0){$('formError').textContent='该演示记录不存在，无法保存。';return}prompts[i]=p}else prompts.unshift(p);selected=p.id;values=valueCache[selected]||values;if(!editing)values={};valueCache[selected]=values;filter='全部';$('search').value='';dirty=false;closeEditor();toast('已保存到本次原型会话，刷新后会重置')};
$('deleteCancel').onclick=()=>$('confirmDelete').close();$('deleteConfirm').onclick=()=>{delete valueCache[selected];prompts=prompts.filter(p=>p.id!==selected);selected=prompts[0]?.id||null;values=valueCache[selected]||{};$('confirmDelete').close();render();toast('已从本次原型会话删除')};
render();
</script></body></html>
